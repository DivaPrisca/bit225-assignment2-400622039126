<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLib Catalogue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>BlueLib Catalogue</h1>
        <p>BlueCrest College Library</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="#catalogue">Catalogue</a>
        <a href="#add-book">Add Book</a>
    </nav>

    <main>
        <section id="catalogue">
            <h2>Book Catalogue</h2>

            <div class="filters">
                <label for="search">Search by title:</label>
                <input type="search" id="search" placeholder="Enter book title">

                <label for="category-filter">Filter by category:</label>
                <select id="category-filter">
                    <option value="All">All Categories</option>
                    <option value="IT">IT</option>
                    <option value="Business">Business</option>
                    <option value="Science">Science</option>
                    <option value="Arts">Arts</option>
                </select>
            </div>

            <div id="book-list" class="book-grid"></div>
        </section>

        <section id="add-book">
            <h2>Add Book</h2>

            <form id="book-form" novalidate>
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title">
                </div>

                <div class="form-group">
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author">
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category">
                        <option value="">Select a category</option>
                        <option value="IT">IT</option>
                        <option value="Business">Business</option>
                        <option value="Science">Science</option>
                        <option value="Arts">Arts</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="copies">Copies Available:</label>
                    <input type="number" id="copies" name="copies" min="0" step="1">
                </div>

                <p id="form-message" class="form-message" role="alert"></p>

                <button type="submit">Add Book</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Name: [Prisca Burgesson] | Student ID: [400622039126]</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
